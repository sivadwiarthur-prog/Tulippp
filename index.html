<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Timer 🌷</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #f4a7b9;
    --pink-light: #fce4ec;
    --pink-mid: #f8c8d4;
    --cream: #fdf6ee;
    --dark: #2d2d2d;
    --purple: #b388ff;
    --teal: #80cbc4;
    --yellow: #fff176;
    --blue: #90caf9;
    --radius: 20px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background-color: var(--cream);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, #e8d8cc 39px, #e8d8cc 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, #e8d8cc 39px, #e8d8cc 40px);
    min-height: 100vh;
    color: var(--dark);
  }

  header {
    background: var(--pink);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--dark);
    box-shadow: 0 4px 0 var(--dark);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  header span.tag {
    background: var(--dark);
    color: var(--yellow);
    font-size: 0.7rem;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px 60px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  /* TIMER CARD */
  .timer-card {
    grid-column: 1 / -1;
    background: var(--pink-light);
    border: 3px solid var(--dark);
    border-radius: var(--radius);
    box-shadow: 6px 6px 0 var(--dark);
    padding: 36px 32px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    position: relative;
    overflow: hidden;
  }

  .timer-card::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    background: var(--pink);
    border-radius: 50%;
    border: 3px solid var(--dark);
    opacity: 0.5;
  }

  .mode-tabs {
    display: flex;
    gap: 12px;
    background: white;
    border: 3px solid var(--dark);
    border-radius: 999px;
    padding: 5px;
  }

  .mode-tab {
    padding: 8px 22px;
    border-radius: 999px;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    color: var(--dark);
  }

  .mode-tab.active {
    background: var(--dark);
    color: var(--yellow);
  }

  .timer-subject {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .timer-subject input {
    border: 2.5px solid var(--dark);
    border-radius: 12px;
    padding: 8px 16px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    background: white;
    color: var(--dark);
    outline: none;
    width: 240px;
    text-align: center;
  }

  .timer-subject input::placeholder { color: #bbb; }

  .timer-display {
    position: relative;
  }

  .timer-ring {
    transform: rotate(-90deg);
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1));
  }

  .ring-bg {
    fill: none;
    stroke: #e0c8d4;
    stroke-width: 10;
  }

  .ring-progress {
    fill: none;
    stroke: var(--dark);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.5s;
  }

  .ring-progress.rest { stroke: #4db6ac; }

  .timer-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .timer-time {
    font-family: 'Space Mono', monospace;
    font-size: 3.4rem;
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
  }

  .timer-label {
    font-size: 0.8rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #888;
    margin-top: 6px;
  }

  .timer-controls {
    display: flex;
    gap: 14px;
  }

  .btn {
    padding: 12px 28px;
    border: 3px solid var(--dark);
    border-radius: 999px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 3px 3px 0 var(--dark);
  }

  .btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--dark); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--dark); }

  .btn-start { background: var(--dark); color: var(--yellow); }
  .btn-reset { background: white; color: var(--dark); }
  .btn-skip { background: var(--pink); color: var(--dark); }

  .session-counter {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 0.9rem;
    color: #777;
  }

  .session-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #ddd;
    border: 2px solid var(--dark);
    transition: background 0.3s;
  }

  .session-dot.done { background: var(--dark); }

  /* TASKS CARD */
  .tasks-card {
    background: var(--yellow);
    border: 3px solid var(--dark);
    border-radius: var(--radius);
    box-shadow: 6px 6px 0 var(--dark);
    padding: 28px 24px;
  }

  .card-title {
    font-weight: 900;
    font-size: 1.1rem;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .task-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .task-input {
    flex: 1;
    border: 2.5px solid var(--dark);
    border-radius: 12px;
    padding: 9px 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    background: white;
    outline: none;
  }

  .btn-add {
    background: var(--dark);
    color: white;
    border: 2.5px solid var(--dark);
    border-radius: 12px;
    padding: 9px 18px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 2px 2px 0 #555;
  }

  .btn-add:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 #555; }

  .task-list { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; }

  .task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: white;
    border: 2.5px solid var(--dark);
    border-radius: 12px;
    padding: 9px 12px;
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .task-check {
    width: 20px; height: 20px;
    border: 2.5px solid var(--dark);
    border-radius: 6px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .task-check.checked { background: var(--dark); }
  .task-check.checked::after { content: '✓'; color: var(--yellow); font-size: 13px; font-weight: 900; }

  .task-text {
    flex: 1;
    font-size: 0.9rem;
    font-weight: 600;
    transition: all 0.2s;
  }

  .task-text.done { text-decoration: line-through; color: #aaa; }

  .task-del {
    background: none;
    border: none;
    cursor: pointer;
    color: #ccc;
    font-size: 1.1rem;
    transition: color 0.2s;
    padding: 0 2px;
  }

  .task-del:hover { color: #e53935; }

  /* STATS CARD */
  .stats-card {
    background: #e8f5e9;
    border: 3px solid var(--dark);
    border-radius: var(--radius);
    box-shadow: 6px 6px 0 var(--dark);
    padding: 28px 24px;
  }

  .stat-row {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .stat-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: white;
    border: 2.5px solid var(--dark);
    border-radius: 12px;
    padding: 12px 16px;
  }

  .stat-label { font-weight: 700; font-size: 0.85rem; color: #555; }
  .stat-value { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 1.1rem; }

  /* NOTIFICATION */
  .notif {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--dark);
    color: var(--yellow);
    padding: 14px 28px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 0.95rem;
    z-index: 999;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
  }

  .notif.show { transform: translateX(-50%) translateY(0); }

  /* PROGRESS BAR */
  .progress-bar-wrap {
    width: 100%;
    height: 10px;
    background: #e0c8d4;
    border-radius: 999px;
    border: 2px solid var(--dark);
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--dark);
    border-radius: 999px;
    transition: width 1s linear;
  }

  .progress-bar-fill.rest { background: #4db6ac; }

  @media (max-width: 600px) {
    .container { grid-template-columns: 1fr; padding: 16px 12px 50px; }
    .timer-card { grid-column: 1; padding: 24px 16px; }
    .timer-time { font-size: 2.6rem; }
    .mode-tabs { flex-wrap: wrap; justify-content: center; }
  }
</style>
</head>
<body>

<header>
  <h1>🌷 Study Timer</h1>
  <span class="tag">Kelompok Tulip</span>
</header>

<div class="container">

  <!-- TIMER CARD -->
  <div class="timer-card">
    <div class="mode-tabs">
      <button class="mode-tab active" onclick="switchMode('study')">📚 Belajar</button>
      <button class="mode-tab" onclick="switchMode('rest')">☕ Istirahat</button>
    </div>

    <div class="timer-subject">
      <input type="text" id="subjectInput" placeholder="Mata pelajaran..." maxlength="30">
    </div>

    <div class="timer-display">
      <svg class="timer-ring" width="220" height="220" viewBox="0 0 220 220">
        <circle class="ring-bg" cx="110" cy="110" r="95"/>
        <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="95"
          stroke-dasharray="596.9" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-text">
        <div class="timer-time" id="timerDisplay">25:00</div>
        <div class="timer-label" id="timerLabel">FOKUS BELAJAR</div>
      </div>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar" style="width:100%"></div>
    </div>

    <div class="timer-controls">
      <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">▶ Mulai</button>
      <button class="btn btn-reset" onclick="resetTimer()">↺ Reset</button>
      <button class="btn btn-skip" onclick="skipSession()">⏭ Skip</button>
    </div>

    <div class="session-counter" id="sessionCounter">
      Sesi: <span id="dot1" class="session-dot"></span><span id="dot2" class="session-dot"></span>
      <span id="dot3" class="session-dot"></span><span id="dot4" class="session-dot"></span>
    </div>
  </div>

  <!-- TASKS -->
  <div class="tasks-card">
    <div class="card-title">📝 Catatan Tugas</div>
    <div class="task-input-row">
      <input class="task-input" id="taskInput" placeholder="Tambah tugas..." maxlength="60"
        onkeydown="if(event.key==='Enter') addTask()">
      <button class="btn-add" onclick="addTask()">+</button>
    </div>
    <div class="task-list" id="taskList">
      <div class="task-item">
        <div class="task-check" onclick="toggleTask(this)"></div>
        <span class="task-text">Belajar Matematika Bab 5</span>
        <button class="task-del" onclick="deleteTask(this)">✕</button>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-card">
    <div class="card-title">📊 Statistik Hari Ini</div>
    <div class="stat-row">
      <div class="stat-item">
        <span class="stat-label">🎯 Sesi Selesai</span>
        <span class="stat-value" id="statSessions">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">⏱ Total Belajar</span>
        <span class="stat-value" id="statTime">0 mnt</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">✅ Tugas Selesai</span>
        <span class="stat-value" id="statTasks">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">☕ Total Istirahat</span>
        <span class="stat-value" id="statRests">0</span>
      </div>
    </div>
  </div>

</div>

<div class="notif" id="notif"></div>

<script>
  const STUDY_TIME = 25 * 60;
  const REST_TIME = 5 * 60;

  let mode = 'study';
  let timeLeft = STUDY_TIME;
  let totalTime = STUDY_TIME;
  let running = false;
  let interval = null;
  let completedSessions = 0;
  let totalStudyMinutes = 0;
  let totalRests = 0;
  let completedTasks = 0;

  const CIRCUMFERENCE = 2 * Math.PI * 95;

  function switchMode(m) {
    if (running) return;
    mode = m;
    timeLeft = m === 'study' ? STUDY_TIME : REST_TIME;
    totalTime = timeLeft;
    document.querySelectorAll('.mode-tab').forEach((t, i) => {
      t.classList.toggle('active', (i === 0 && m === 'study') || (i === 1 && m === 'rest'));
    });
    updateDisplay();
    updateRing();
    updateProgress();
  }

  function updateDisplay() {
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('timerDisplay').textContent = `${m}:${s}`;
    document.getElementById('timerLabel').textContent = mode === 'study' ? 'FOKUS BELAJAR' : 'ISTIRAHAT';

    const ring = document.getElementById('ringProgress');
    const pb = document.getElementById('progressBar');
    if (mode === 'rest') {
      ring.classList.add('rest');
      pb.classList.add('rest');
    } else {
      ring.classList.remove('rest');
      pb.classList.remove('rest');
    }
  }

  function updateRing() {
    const fraction = timeLeft / totalTime;
    const offset = CIRCUMFERENCE * (1 - fraction);
    document.getElementById('ringProgress').style.strokeDashoffset = offset;
  }

  function updateProgress() {
    const pct = (timeLeft / totalTime) * 100;
    document.getElementById('progressBar').style.width = pct + '%';
  }

  function toggleTimer() {
    if (running) {
      clearInterval(interval);
      running = false;
      document.getElementById('startBtn').textContent = '▶ Lanjut';
    } else {
      running = true;
      document.getElementById('startBtn').textContent = '⏸ Pause';
      interval = setInterval(() => {
        timeLeft--;
        updateDisplay();
        updateRing();
        updateProgress();
        if (timeLeft <= 0) sessionEnd();
      }, 1000);
    }
  }

  function resetTimer() {
    clearInterval(interval);
    running = false;
    timeLeft = totalTime;
    document.getElementById('startBtn').textContent = '▶ Mulai';
    updateDisplay();
    updateRing();
    updateProgress();
  }

  function skipSession() {
    clearInterval(interval);
    running = false;
    sessionEnd();
  }

  function sessionEnd() {
    clearInterval(interval);
    running = false;
    document.getElementById('startBtn').textContent = '▶ Mulai';

    if (mode === 'study') {
      completedSessions++;
      totalStudyMinutes += 25;
      updateDots();
      document.getElementById('statSessions').textContent = completedSessions;
      document.getElementById('statTime').textContent = totalStudyMinutes + ' mnt';
      showNotif('🎉 Sesi belajar selesai! Waktunya istirahat 5 menit.');
      setTimeout(() => switchMode('rest'), 1200);
    } else {
      totalRests++;
      document.getElementById('statRests').textContent = totalRests;
      showNotif('✅ Istirahat selesai! Ayo mulai belajar lagi!');
      setTimeout(() => switchMode('study'), 1200);
    }
  }

  function updateDots() {
    for (let i = 1; i <= 4; i++) {
      document.getElementById('dot' + i).classList.toggle('done', i <= (completedSessions % 4 || (completedSessions > 0 && completedSessions % 4 === 0 ? 4 : 0)));
    }
  }

  function showNotif(msg) {
    const el = document.getElementById('notif');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3500);
  }

  function addTask() {
    const input = document.getElementById('taskInput');
    const val = input.value.trim();
    if (!val) return;

    const item = document.createElement('div');
    item.className = 'task-item';
    item.innerHTML = `
      <div class="task-check" onclick="toggleTask(this)"></div>
      <span class="task-text">${val}</span>
      <button class="task-del" onclick="deleteTask(this)">✕</button>
    `;
    document.getElementById('taskList').prepend(item);
    input.value = '';
    input.focus();
  }

  function toggleTask(el) {
    el.classList.toggle('checked');
    const text = el.nextElementSibling;
    const wasDone = text.classList.contains('done');
    text.classList.toggle('done');
    completedTasks += wasDone ? -1 : 1;
    if (completedTasks < 0) completedTasks = 0;
    document.getElementById('statTasks').textContent = completedTasks;
  }

  function deleteTask(btn) {
    const item = btn.closest('.task-item');
    if (item.querySelector('.task-check.checked')) {
      completedTasks = Math.max(0, completedTasks - 1);
      document.getElementById('statTasks').textContent = completedTasks;
    }
    item.remove();
  }

  // Init
  updateDisplay();
  updateRing();
  updateProgress();
</script>
</body>
</html>
